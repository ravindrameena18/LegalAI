services:
  postgres:
    image: pgvector/pgvector:pg16
    environment:
      POSTGRES_USER: legalai
      POSTGRES_PASSWORD: change-me
      POSTGRES_DB: legalai
    ports:
      - "5432:5432"
    volumes:
      - legalai-postgres:/var/lib/postgresql/data
  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"
    volumes:
      - legalai-redis:/data

volumes:
  legalai-postgres:
  legalai-redis:
